[package]
name = "vrcl"
version = "0.1.0"
description = "VRChat Launch Option Manager"
authors = []
edition = "2021"

[lib]
name = "vrcl_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.52"
